# Every `uses:` in .github/workflows is pinned by full commit SHA with its release as the comment
# (PUBLISHING.md rule 9). Dependabot keeps those pins current: a new release arrives as a reviewed pull
# request, never silently. The org's shared workflows are grouped by source, so one release of a source
# is one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      krateo-charts:
        patterns:
          - "krateo-blueprints/charts*"
      krateo-platformops:
        patterns:
          - "krateo-platformops/.github*"
