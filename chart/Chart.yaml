apiVersion: v2
name: openstack-cinder-provider-kog
description: >-
  Krateo KOG provider that turns OpenStack Cinder (block storage v3) volumes into
  Kubernetes custom resources. The chart ships a RestDefinition, a curated OpenAPI 3.0
  subset and a Keystone auth-bridge proxy. oasgen-provider generates the CRD and runs one
  rest-dynamic-controller for it.
type: application

# release-oci substitutes every CHART_VERSION from the pushed X.Y.Z tag, so version and
# appVersion are always the release version (repository standard R4). No image is shipped:
# oasgen-provider spawns the controller, and the auth-bridge runs a public openstack-client image.
version: CHART_VERSION
appVersion: "CHART_VERSION"

# The Marketplace turns keywords into filter chips (PUBLISHING.md rule 3): domain and kind words only.
keywords:
  - openstack
  - cinder
  - block-storage
  - volume
  - storage
  - kog
home: https://github.com/krateo-blueprints/openstack-cinder-provider-kog
sources:
  - https://github.com/krateo-blueprints/openstack-cinder-provider-kog
maintainers:
  - name: krateo
# The org-controlled logo URL the other OpenStack KOGs use (see openstack-nova-operator-kog's Chart.yaml).
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
annotations:
  krateo.io/category: storage
  krateo.io/display-name: OpenStack Cinder KOG
  krateo.io/maturity: alpha
